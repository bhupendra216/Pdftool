<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>PDFKira — Free Online PDF and Image Tools</title>

    <meta
      name="description"
      content="Free online PDF and image tools for merging, splitting, compressing, converting, signing, OCR, and organizing files securely in your browser."
    />
    <meta name="keywords" content="PDF tools, merge PDF, split PDF, compress PDF, convert PDF, OCR, sign PDF, image tools, PDFKira" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pdfkira.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="PDFKira — Free Online PDF and Image Tools" />
    <meta
      property="og:description"
      content="PDFKira provides free, privacy-friendly PDF and image tools for merging, splitting, compressing, converting, OCR, and signing documents online."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pdfkira.com/" />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:site_name" content="PDFKira" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PDFKira — Free Online PDF and Image Tools" />
    <meta
      name="twitter:description"
      content="Free, privacy-friendly PDF and image tools online: merge, split, compress, convert, OCR, sign, and organize files with PDFKira."
    />
    <meta name="twitter:image" content="/favicon.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PDFKira",
      "url": "https://pdfkira.com/",
      "description": "Free online PDF and image tools to merge, split, compress, convert, OCR, sign, and organize files securely in your browser.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://pdfkira.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
