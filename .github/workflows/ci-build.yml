name: CI Build

on:
  pull_request:
    branches: [ main, master, production, development ]
  push:
    branches: [ main, master, production, development ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace build
        run: pnpm run build
